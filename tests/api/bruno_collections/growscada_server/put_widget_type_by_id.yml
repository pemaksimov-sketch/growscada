info:
  name: put widget type by id
  type: http
  seq: 9

http:
  method: PUT
  url: http://{{API_SERVER}}/api/v0/widget-types/{{WIDGET_TYPE_ID}}
  body:
    type: json
    data: |-
      {
        "name": "pressure gauge updated",
        "html_template": "<div class=\"gauge updated\"><span class=\"value\"></span></div>",
        "script": "function render(inputs) { document.querySelector('.value').textContent = inputs.pressure.value + ' bar'; }",
        "script_language": "javascript",
        "default_width": 200,
        "default_height": 200,
        "input_ports": [
          { "name": "pressure", "description": "Line pressure in bar", "type_hint": "integer" },
          { "name": "temperature", "description": "Fluid temperature", "type_hint": "integer" }
        ],
        "version": 1
      }
  auth: inherit

docs: |
  Changing a port's type_hint to a type incompatible with an existing
  Widget binding returns 400 before saving the definition. Unbind or
  replace the incompatible Tag first. An empty hint accepts any type.
  Removing a port retains the existing orphan-binding cleanup behavior.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
