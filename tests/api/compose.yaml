services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: growscada
      POSTGRES_PASSWORD: growscada
      POSTGRES_DB: growscada
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U growscada -d growscada"]
      interval: 1s
      timeout: 5s
      retries: 30
  migrate:
    image: growscada-api-test:${API_TEST_IMAGE_TAG:-local}
    build:
      context: ../..
    entrypoint: [goose, -dir, /migrations, up]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://growscada:growscada@db:5432/growscada?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  server:
    image: growscada-api-test:${API_TEST_IMAGE_TAG:-local}
    build:
      context: ../..
    environment:
      DATABASE_DSN: postgres://growscada:growscada@db:5432/growscada?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://localhost:9090/api/v0/scenes"]
      interval: 1s
      timeout: 5s
      retries: 30
  bruno:
    build:
      context: ../..
      dockerfile: tests/api/Dockerfile.bruno
    volumes:
      - ../../artifacts/api:/reports
    depends_on:
      server:
        condition: service_healthy
