name: Go CI

on:
  workflow_dispatch:
  push:
    branches: [path, 'codex/**']
  pull_request:
    branches: [path]

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Cache PostgreSQL image from Docker's public ECR mirror
        run: |
          docker pull public.ecr.aws/docker/library/postgres:16-alpine
          docker tag public.ecr.aws/docker/library/postgres:16-alpine postgres:16-alpine

      - name: Run tests
        run: make test

      - name: Build
        run: make build
